<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Aluguéis — Protótipo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111827'/><path d='M7 15l9-8 9 8M9 14v11h14V14' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>">
<style>

:root{
  --bg:#F7F7F5;
  --surface:#FFFFFF;
  --ink:#111827;
  --ink-2:#374151;
  --muted:#6B7280;
  --line:#E5E7EB;
  --line-soft:#F1F1EF;
  --accent:#1D4ED8;
  --accent-dark:#1A45C0;
  --danger:#B42318;
  --warn:#B54708;
  --ok:#067647;
  --hover:#FAFAF9;
  --danger-bg:#FEF3F2;
  --danger-line:#FADBD8;
  --warn-bg:#FFFAEB;
  --ok-bg:#ECFDF3;
  --info-bg:#EFF4FF;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}

/* ---------- estrutura ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:220px;flex:0 0 220px;background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line)}
.brand-mark{width:30px;height:30px;flex:0 0 30px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600}
.brand strong{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--muted)}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
  border:0;background:none;border-radius:6px;font-size:13.5px;
  color:var(--ink-2);text-align:left;
}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:#F0F1EF;color:var(--ink);font-weight:600}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;color:var(--muted)}
.nav-item.active svg{color:var(--accent)}
.sidebar-foot{border-top:1px solid var(--line);padding:8px}
.user{display:flex;align-items:center;gap:10px;padding:10px 8px 4px}
.user strong{display:block;font-size:12.5px}
.user small{display:block;font-size:11px;color:var(--muted)}
.proto-note{padding:8px 10px 2px;font-size:10.5px;color:#9CA3AF;letter-spacing:.02em}
.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:#EAECEA;color:var(--ink-2);display:grid;place-items:center;font-size:11.5px;font-weight:600}
.avatar.sm{width:26px;height:26px;flex-basis:26px;font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;width:min(420px,100%);border:1px solid var(--line);border-radius:6px;background:#FAFAF9}
.search svg{width:15px;height:15px;flex:0 0 15px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:13px}
.search kbd{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;background:#fff;padding:1px 5px}
.topbar-right{display:flex;align-items:center;gap:10px}
.tenant{font-size:12.5px;color:var(--muted);white-space:nowrap}
#content{width:100%;max-width:1280px;margin:0 auto;padding:22px 24px 56px}

/* ---------- cabeçalho de tela ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-head h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 2px}
.page-head p{margin:0;font-size:13px;color:var(--muted)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- botões ---------- */
.btn{
  height:32px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);border-radius:6px;background:var(--surface);
  font-size:13px;font-weight:500;white-space:nowrap;
}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:#F0F1EF}
.link{border:0;background:none;padding:0;font-size:12.5px;color:var(--accent)}
.link:hover{text-decoration:underline}

/* ---------- cartões ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin:0}
.card-head .sub{font-size:12px;color:var(--muted)}
.card-body{padding:16px}

/* ---------- indicadores ---------- */
.grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:12px 14px}
.stat .label{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stat .value{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .value.money{font-size:19px}
.stat .hint{font-size:12px;color:var(--muted);margin-top:1px}
.stat.alert .value,.stat.alert .hint{color:var(--danger)}

/* ---------- colunas ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* ---------- tabelas ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  padding:8px 12px;text-align:left;font-size:11px;font-weight:500;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row-click{cursor:pointer}
tbody tr.row-click:hover td{background:var(--hover)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.right{text-align:right}
.muted{color:var(--muted)}
.small{font-size:12px}
.strong{font-weight:600}
.text-danger{color:var(--danger)}
.text-ok{color:var(--ok)}
.nowrap{white-space:nowrap}

/* ---------- etiquetas ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;
  font-size:11px;font-weight:500;white-space:nowrap;border:1px solid transparent;
}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.info{background:var(--info-bg);color:var(--accent)}
.badge.neutral{background:#F3F4F6;color:#4B5563}

/* ---------- prazos / publicações ---------- */
.deadline{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.deadline:last-child{border-bottom:0}
.deadline-main{flex:1;min-width:0}
.deadline-title{font-size:13px;font-weight:500}
.deadline .meta{font-size:12px;color:var(--muted);margin-top:2px}
.deadline-actions{display:flex;gap:6px;flex-shrink:0}
.pub{padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.pub:last-child{border-bottom:0}
.pub-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.pub-title{font-size:12.5px;font-weight:500}
.pub-text{font-size:12.5px;color:var(--muted);margin:2px 0 8px}

/* ---------- resumos ---------- */
.mini-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.mini-row:last-child{border-bottom:0}
.total-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line);font-size:13px;font-weight:600}
.alert-strip{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:16px;padding:9px 14px;background:var(--danger-bg);
  border:1px solid var(--danger-line);border-radius:6px;color:#7A271A;font-size:13px;
}

/* ---------- filtros ---------- */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:6px 6px 0 0}
.filters select{height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12.5px;outline:none}
.filters select:focus{border-color:var(--accent)}
.filters .spacer{flex:1}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}
.chip:hover{background:var(--hover)}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.chip-x{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;color:var(--ink-2)}

/* ---------- abas ---------- */
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 9px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;font-size:13px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tab-body{min-height:80px}
.pane-pad{padding:16px}

/* ---------- linha do tempo ---------- */
.timeline{display:flex;flex-direction:column;padding:18px 16px 8px}
.timeline-item{position:relative;display:flex;gap:12px;padding-bottom:20px}
.timeline-item:last-child{padding-bottom:0}
.timeline-item:not(:last-child)::before{content:"";position:absolute;left:5px;top:14px;bottom:2px;width:1px;background:var(--line)}
.timeline-dot{position:relative;z-index:1;width:11px;height:11px;flex:0 0 11px;margin-top:4px;border:2px solid var(--line);border-radius:50%;background:#fff}
.timeline-dot.active{border-color:var(--accent);background:var(--accent)}
.timeline-text{font-size:13px}
.timeline-date{font-size:11.5px;color:var(--muted);margin-top:1px}

/* ---------- agenda semanal ---------- */
.week-wrap{overflow-x:auto}
.week{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));min-width:750px}
.week-day{border-right:1px solid var(--line);min-height:300px}
.week-day:last-child{border-right:0}
.week-day-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.week-day.today .week-day-head{background:#F5F7FF;color:var(--accent);font-weight:600}
.week-body{display:flex;flex-direction:column;gap:6px;padding:8px;min-height:260px}
.prazo-block{
  display:flex;flex-direction:column;gap:1px;width:100%;padding:7px 9px;
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;
  background:#fff;text-align:left;font-size:11.5px;
}
.prazo-block:hover{background:var(--hover)}
.prazo-block.fatal{border-left-color:var(--danger)}
.prazo-block.done{opacity:.45;text-decoration:line-through}
.pb-time{font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.pb-title{font-size:12.5px;font-weight:500}
.pb-meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.week-toolbar .mid{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.week-toolbar .mid strong{color:var(--ink);font-weight:500}

/* ---------- detalhe do processo ---------- */
.proc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:12px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.proc-head h1{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;font-weight:600;letter-spacing:-.01em;margin:4px 0 3px}
.proc-sub{font-size:12.5px;color:var(--muted)}
.proc-summary{display:grid;grid-template-columns:1fr 1fr;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.proc-summary .cell{padding:12px 16px;border-right:1px solid var(--line);font-size:13px;min-width:0}
.proc-summary .cell:last-child{border-right:0}
.proc-summary .label{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.proc-summary .val{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proc-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0}
.dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px 16px;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}

/* ---------- modelos ---------- */
.model-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.model{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 16px}
.model h3{font-size:13.5px;font-weight:600;margin:0}
.model p{margin:0 0 4px;font-size:12.5px;color:var(--muted)}

/* ---------- vazio ---------- */
.empty{padding:28px 16px;text-align:center;font-size:13px;color:var(--muted)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:64px 16px;background:rgba(17,24,39,.45);overflow:auto}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
.modal-head strong{font-size:14px}
.modal-body{display:grid;gap:12px;padding:18px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#FAFAF9;border-radius:0 0 8px 8px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:500;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px;outline:none}
.field textarea{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{margin:0;font-size:12px;color:var(--muted)}

/* ---------- aviso ---------- */
#toast-root{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{padding:9px 14px;border-radius:6px;background:var(--ink);color:#fff;font-size:13px;animation:toast-in .18s ease-out}
@keyframes toast-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- responsivo ---------- */
@media (max-width:1080px){
  .grid-stats{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .sidebar{width:64px;flex:0 0 64px}
  .brand{justify-content:center;padding:14px 0}
  .brand>div,.nav-item span,.user>div{display:none}
  .nav{padding:8px 6px}
  .nav-item{justify-content:center;padding:9px}
  .sidebar-foot .nav-item{justify-content:center}
  .proto-note{display:none}
  .tenant{display:none}
  #content{padding:18px 14px 48px}
  .page-head{flex-direction:column}
  .model-grid,.form-row{grid-template-columns:1fr}
  .proc-head{flex-direction:column}
  .proc-side{align-items:flex-start}
}
@media (max-width:560px){
  .grid-stats{grid-template-columns:1fr}
  .topbar{padding:0 14px}
  .search kbd{display:none}
  .deadline{flex-wrap:wrap}
  .deadline-main{flex:1 1 100%}
  .deadline-actions{margin-left:auto}
  .proc-summary{grid-template-columns:1fr}
  .proc-summary .cell{border-right:0;border-bottom:1px solid var(--line)}
  .proc-summary .cell:last-child{border-bottom:0}
}

/* ---------- aluguéis ---------- */
.month-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.month-toolbar .mid{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.month-toolbar .mid strong{color:var(--ink);font-weight:500}
.breakdown{display:flex;flex-direction:column;gap:5px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#FAFAF9;font-size:12.5px}
.breakdown .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.breakdown .row.total{margin-top:3px;padding-top:7px;border-top:1px solid var(--line);font-size:13px;font-weight:600}
.vacancy-highlight{padding:16px}
.vacancy-highlight .big{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:2px 0}
.vacancy-highlight .sub{font-size:12.5px;color:var(--muted)}
.contract-alert{padding:14px 16px}
.contract-alert .who{font-size:13px;font-weight:500}
.contract-alert .what{font-size:12.5px;color:var(--muted);margin-top:2px}
.contract-alert .est{margin-top:8px;font-size:12.5px}
.contract-alert .est strong{font-size:15px}
.unit-actions{display:flex;gap:6px;flex-wrap:wrap}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
      </span>
      <div><strong>Aluguéis</strong><small>Vila dos Ipês</small></div>
    </div>
    <nav class="nav" aria-label="Navegação principal">
      <button class="nav-item" data-view="hoje">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Hoje</span>
      </button>
      <button class="nav-item" data-view="imoveis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
        <span>Imóveis</span>
      </button>
      <button class="nav-item" data-view="inquilinos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/><path d="M16 4.6a3 3 0 0 1 0 5.8M18 20c0-2.1-.8-3.7-2-4.5"/></svg>
        <span>Inquilinos</span>
      </button>
      <button class="nav-item" data-view="contratos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
        <span>Contratos</span>
      </button>
      <button class="nav-item" data-view="cobrancas">

function addDays(date, n){ const x = new Date(date); x.setDate(x.getDate() + n); x.setHours(0,0,0,0); return x; }

const fmt = date => `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}`;
const fmtAno = date => `${fmt(date)}/${date.getFullYear()}`;
function fmtLong(date){
  const s = date.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const diffDays = (a,b) => Math.round((startOfDay(a) - startOfDay(b)) / 86400000);
const sameDay = (a,b) => diffDays(a,b) === 0;
const money = v => v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
function esc(v){
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function plural(n, s, p){ return n === 1 ? s : p; }

function mesRef(off){ return new Date(HOJE.getFullYear(), HOJE.getMonth() + off, 1); }
function diaNoMes(off, dia){
  const ref = mesRef(off);
  const ultimo = new Date(ref.getFullYear(), ref.getMonth() + 1, 0).getDate();
  return new Date(ref.getFullYear(), ref.getMonth(), Math.min(dia, ultimo));
}
function mesLabel(date){
  const s = date.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function noMes(date, ref){
  return date.getFullYear() === ref.getFullYear() && date.getMonth() === ref.getMonth();
}
function addMonths(date, n){
  const x = new Date(date);
  const dia = x.getDate();
  x.setDate(1);
  x.setMonth(x.getMonth() + n);
  const ultimo = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
  x.setDate(Math.min(dia, ultimo));
  return x;
}

  return { dias, multa, juros, total:c.valor + multa + juros };
}

      ${stat('Manutenções abertas', abertas.length, money(custoAberto) + ' estimados', { money:true })}
    </div>

    ${alerta ? `<div class="alert-strip">
      <span><strong>${atrasadas.length} ${plural(atrasadas.length,'aluguel atrasado','aluguéis atrasados')}</strong> — ${esc(inquilinoAlerta.nome)} · ${esc(unidadeAlerta.nome)} · há ${diasAtraso(alerta)} dias</span>

    </div>` : ''}

      <div class="stack">
        <section class="card">
          <div class="card-head">
            <h2>Cobranças do mês</h2>
            <span class="sub">${doMes.length} cobranças · ${money(totalMes)} previstos</span>
            <button class="link" data-action="nav" data-id="cobrancas">Ver todas</button>
          </div>
          ${doMes.map(c => {
            const ct = contrato(c.contratoId);
            const t = inquilino(ct.inquilinoId);
            const u = unidade(ct.unidadeId);

                <div class="deadline-title">${esc(t.nome)} · ${esc(u.nome)}</div>

        <section class="card">

/* ============================================================
   Tela: Imóveis
   ============================================================ */
function renderImoveis(){
  const termo = state.search.trim().toLowerCase();
  let lista = unidades.slice();
  if(state.filtroStatus) lista = lista.filter(u => u.status === state.filtroStatus);
  if(termo) lista = lista.filter(u => {
    const ct = contratoAtivo(u.id);
    const nomeInquilino = ct ? inquilino(ct.inquilinoId).nome : '';
    return (u.nome + ' ' + u.tipo + ' ' + u.status + ' ' + nomeInquilino + ' ' + CONDOMINIO.endereco).toLowerCase().includes(termo);
  });

  const aluguelTotal = unidades.filter(u => u.status === 'Alugado').reduce((s,u) => s + u.aluguel, 0);

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Imóveis</h1>
        <p>${unidades.length} unidades em ${CONDOMINIO.nome} · ${CONDOMINIO.endereco}</p>
      </div>
      <div class="actions"><button class="btn primary" data-action="new-unit">Nova unidade</button></div>
    </div>

    <div class="grid-stats">
      ${stat('Unidades', unidades.length, 'todas no mesmo endereço')}
      ${stat('Alugadas', unidades.filter(u => u.status === 'Alugado').length, money(aluguelTotal) + ' por mês', { money:true })}
      ${stat('Vagas', unidades.filter(u => u.status === 'Vago').length, 'sem contrato ativo')}
      ${stat('Em manutenção', unidades.filter(u => u.status === 'Manutenção').length, 'fora do mercado')}
    </div>

    <section class="card">
      <div class="filters">
        <select data-filter="filtroStatus" aria-label="Filtrar por status">
          <option value="">Status: todos</option>
          ${['Alugado','Vago','Manutenção'].map(s => `<option value="${s}" ${state.filtroStatus === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
        <span class="spacer"></span>
        <span class="small muted">Abra uma unidade para ver contrato, cobranças e despesas</span>
      </div>
      <table>
        <thead><tr><th>Unidade</th><th>Status</th><th>Inquilino</th><th>Aluguel</th><th>Vencimento</th><th>Contrato até</th></tr></thead>
        <tbody>
          ${lista.length ? lista.map(u => {
            const ct = contratoAtivo(u.id);
            const t = ct ? inquilino(ct.inquilinoId) : null;
            return `<tr class="row-click" data-action="open-unit" data-id="${u.id}">
              <td><span class="strong">${esc(u.nome)}</span><div class="small muted">${esc(u.tipo)} · ${u.quartos} quartos · ${u.area} m²</div></td>
              <td>${badgeUnidade(u.status)}</td>
              <td>${t ? esc(t.nome) : '<span class="small muted">' + (u.status === 'Vago' ? 'vago há ' + diffDays(HOJE, u.vagoDesde || HOJE) + ' dias' : 'sem contrato') + '</span>'}</td>
              <td class="num nowrap">${u.status === 'Alugado' ? money(u.aluguel) : `<span class="muted">${money(u.aluguelPretendido)}</span><div class="small muted">pretendido</div>`}</td>
              <td class="nowrap">${u.status === 'Alugado' ? 'dia ' + u.vencimentoDia : '—'}</td>
              <td class="num nowrap">${ct ? fmtAno(ct.fim) + '<div class="small muted">' + statusContrato(ct) + '</div>' : '—'}</td>
            </tr>`;
          }).join('') : '<tr><td colspan="6"><div class="empty">Nenhuma unidade encontrada.</div></td></tr>'}
        </tbody>
      </table>
    </section>
  `;
}

/* ============================================================
   Tela: Unidade (detalhe)
   ============================================================ */
function renderUnidade(){
  const u = unidades.find(x => x.id === state.selectedUnit);
  if(!u){
    content.innerHTML = '<div class="empty">Unidade não encontrada. <button class="link" data-action="nav" data-id="imoveis">Voltar para imóveis</button></div>';
    return;
  }

  const ct = contratoAtivo(u.id);
  const t = ct ? inquilino(ct.inquilinoId) : null;
  const ref = mesRef(0);
  const cobrancasUnidade = ct ? cobrancas.filter(c => c.contratoId === ct.id).sort((a,b) => b.vencimento - a.vencimento) : [];
  const doMesUnidade = ct ? cobrancasDoMes(ref).filter(c => c.contratoId === ct.id) : [];
  const recebido = doMesUnidade.filter(c => c.pagoEm).reduce((s,c) => s + c.valor, 0);
  const aberto = doMesUnidade.filter(c => !c.pagoEm).reduce((s,c) => s + c.valor, 0);
  const despesasUnidade = despesas.filter(x => x.unidadeId === u.id && noMes(x.data, ref));
  const totalDespesas = despesasUnidade.reduce((s,x) => s + x.valor, 0);
  const manutencoesUnidade = manutencoes.filter(m => m.unidadeId === u.id);

  const tabs = [
    ['contrato','Contrato'],
    ['cobrancas','Cobranças'],
    ['despesas','Despesas'],
    ['manutencao','Manutenção'],
    ['documentos','Documentos']
  ];

  let painel = '';

  if(state.unitTab === 'contrato'){
    if(ct){
      const status = statusContrato(ct);
      const podeReajustar = diffDays(ct.dataBase, HOJE) >= 0 && diffDays(ct.dataBase, HOJE) <= 120;
      painel = `<div class="pane-pad">
        <dl class="dl">
          <dt>Inquilino</dt><dd>${esc(t.nome)}</dd>
          <dt>Contato</dt><dd>${esc(t.telefone)} · ${esc(t.email)}</dd>
          <dt>CPF</dt><dd>${esc(t.cpf)}</dd>
          <dt>Vigência</dt><dd>${fmtAno(ct.inicio)} a ${fmtAno(ct.fim)}</dd>
          <dt>Aluguel</dt><dd class="strong">${money(ct.aluguel)}</dd>
          <dt>Vencimento</dt><dd>Todo dia ${ct.vencimentoDia}</dd>
          <dt>Índice de reajuste</dt><dd>${esc(ct.indice)} · data-base ${fmtAno(ct.dataBase)}</dd>
          <dt>Garantia</dt><dd>${esc(ct.garantia)}</dd>
          <dt>Status</dt><dd>${badgeContrato(status)}</dd>
        </dl>

        ${podeReajustar ? `<div class="breakdown" style="margin-top:16px;max-width:420px">
          <div class="row"><span>Próximo reajuste</span><strong>${fmtAno(ct.dataBase)}</strong></div>
          <div class="row"><span>Índice</span><span>${esc(ct.indice)} · 4,2% estimado</span></div>
          <div class="row total"><span>Aluguel estimado</span><span>${money(ct.aluguel * 1.042)}</span></div>
        </div>` : ''}

        ${ct.reajustes.length ? `<div style="margin-top:16px;max-width:420px">
          <div class="small muted" style="margin-bottom:4px">Últimos reajustes</div>
          ${ct.reajustes.map(r => `<div class="mini-row" style="padding-left:0;padding-right:0">
            <span>${fmtAno(r.data)}</span>
            <span class="num">${money(r.de)} → <strong>${money(r.para)}</strong></span>
          </div>`).join('')}
        </div>` : ''}

        <div class="actions" style="margin-top:18px">
          <button class="btn primary" data-action="renew" data-id="${ct.id}">Renovar contrato</button>
          <button class="btn" data-action="end-contract" data-id="${ct.id}">Encerrar contrato</button>
        </div>
      </div>`;
    } else {
      const encerrado = contratos.filter(c => c.unidadeId === u.id && c.status === 'Encerrado').sort((a,b) => b.fim - a.fim)[0];
      painel = `<div class="empty">
        <div>Sem contrato ativo nesta unidade.</div>
        ${encerrado ? `<div class="small muted" style="margin-top:6px">Último contrato: ${esc(inquilino(encerrado.inquilinoId).nome)} · encerrado em ${fmtAno(encerrado.fim)} · ${money(encerrado.aluguel)}</div>` : ''}
        <button class="btn sm" style="margin-top:10px" data-action="new-contract" data-id="${u.id}">Criar contrato</button>
      </div>`;
    }
  }

  if(state.unitTab === 'cobrancas'){
    painel = `<table>
      <thead><tr><th>Competência</th><th>Vencimento</th><th>Valor</th><th>Status</th><th class="right">Ação</th></tr></thead>
      <tbody>
        ${cobrancasUnidade.length ? cobrancasUnidade.map(c => `<tr>
          <td class="nowrap">${mesLabel(c.competencia)}</td>
          <td class="num nowrap">${fmt(c.vencimento)}</td>
          <td class="num">${money(c.valor)}</td>
          <td>${badgeCobranca(statusCobranca(c))}</td>
          <td class="right">${acaoCobranca(c)}</td>
        </tr>`).join('') : '<tr><td colspan="5"><div class="empty">Nenhuma cobrança.</div></td></tr>'}
      </tbody>
    </table>`;
  }

  if(state.unitTab === 'despesas'){
    painel = `<table>
      <thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th class="right">Valor</th></tr></thead>
      <tbody>
        ${despesasUnidade.length ? despesasUnidade.slice().sort((a,b) => b.data - a.data).map(x => `<tr>
          <td class="num nowrap">${fmt(x.data)}</td>
          <td><span class="badge neutral">${esc(x.categoria)}</span></td>
          <td>${esc(x.descricao)}</td>
          <td class="right num">${money(x.valor)}</td>
        </tr>`).join('') : '<tr><td colspan="4"><div class="empty">Nenhuma despesa neste mês.</div></td></tr>'}
      </tbody>
    </table>`;
  }

  if(state.unitTab === 'manutencao'){
    painel = `<table>
      <thead><tr><th>Chamado</th><th>Prioridade</th><th>Fornecedor</th><th>Custo</th><th>Status</th><th class="right">Ação</th></tr></thead>
      <tbody>
        ${manutencoesUnidade.length ? manutencoesUnidade.map(m => `<tr>
          <td>${esc(m.titulo)}<div class="small muted">aberto há ${diffDays(HOJE, m.abertura)} dias</div></td>
          <td>${badgePrioridade(m.prioridade)}</td>
          <td class="nowrap">${esc(m.fornecedor)}</td>
          <td class="num">${money(m.custo)}</td>
          <td>${m.status === 'Concluída' ? '<span class="badge ok">Concluída</span>' : '<span class="badge ' + (m.status === 'Em andamento' ? 'info' : 'warn') + '">' + esc(m.status) + '</span>'}</td>
          <td class="right">${m.status === 'Concluída' ? '<span class="small muted">—</span>' : `<button class="btn sm" data-action="complete-maintenance" data-id="${m.id}">Concluir</button>`}</td>
        </tr>`).join('') : '<tr><td colspan="6"><div class="empty">Nenhuma manutenção.</div></td></tr>'}
      </tbody>
    </table>`;
  }

  if(state.unitTab === 'documentos'){
    painel = `<table>
      <thead><tr><th>Documento</th><th>Tipo</th><th>Data</th><th>Tamanho</th><th class="right">Ação</th></tr></thead>
      <tbody>
        ${u.docs.length ? u.docs.map(doc => `<tr>
          <td>${esc(doc.nome)}</td>
          <td class="small muted">${esc(doc.tipo)}</td>
          <td class="num nowrap">${fmt(doc.data)}</td>
          <td class="small muted nowrap">${esc(doc.tamanho)}</td>
          <td class="right"><button class="btn sm" data-action="toast" data-msg="Download simulado neste protótipo">Baixar</button></td>
        </tr>`).join('') : '<tr><td colspan="5"><div class="empty">Nenhum documento.</div></td></tr>'}
      </tbody>
    </table>`;
  }

  const resumoContrato = ct
    ? `<div class="label">Contrato ativo</div>
       <div class="val">${badgeContrato(statusContrato(ct))} <span>${esc(t.nome)}</span> <span class="small muted">${money(ct.aluguel)} · até ${fmtAno(ct.fim)}</span></div>`
    : u.status === 'Vago'
      ? `<div class="label">Vacância</div>
         <div class="val"><span class="strong">${diffDays(HOJE, u.vagoDesde)} dias sem locação</span> <span class="small muted">perda estimada ${money(Math.round(diffDays(HOJE, u.vagoDesde) / 30 * u.aluguelPretendido))}</span></div>`
      : `<div class="label">Em manutenção</div>
         <div class="val"><span>${manutencoesUnidade.filter(m => m.status !== 'Concluída').map(m => esc(m.titulo)).join(', ') || 'Obra em andamento'}</span> <span class="small muted">previsão ${u.previsao ? fmt(u.previsao) : '—'}</span></div>`;

  content.innerHTML = `
    <div class="proc-head">
      <div>
        <button class="link" data-action="nav" data-id="imoveis">← Imóveis</button>
        <h1>${esc(u.nome)}</h1>
        <div class="proc-sub">${esc(u.tipo)} · ${u.quartos} quartos · ${u.area} m² · ${CONDOMINIO.nome} — ${CONDOMINIO.endereco}</div>
      </div>
      <div class="proc-side">
        ${badgeUnidade(u.status)}
        <div class="unit-actions">
          ${!ct ? `<button class="btn" data-action="new-contract" data-id="${u.id}">Novo contrato</button>` : ''}
          <button class="btn" data-action="new-expense" data-id="${u.id}">Nova despesa</button>
          <button class="btn" data-action="new-maintenance" data-id="${u.id}">Nova manutenção</button>
        </div>
      </div>
    </div>

    <div class="proc-summary">
      <div class="cell">${resumoContrato}</div>
      <div class="cell">
        <div class="label">Financeiro do mês</div>
        <div class="val">
          <span class="small muted">Recebido</span> <span class="num">${money(recebido)}</span>
          <span class="small muted">Em aberto</span> <span class="num ${aberto ? 'text-danger' : ''}">${money(aberto)}</span>
          <span class="small muted">Despesas</span> <span class="num">${money(totalDespesas)}</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        ${tabs.map(([key,label]) => `<button class="tab ${state.unitTab === key ? 'active' : ''}" data-action="unit-tab" data-id="${key}">${label}</button>`).join('')}
      </div>
      <div class="tab-body">${painel}</div>
    </div>
  `;
}

/* ============================================================
   Tela: Inquilinos
   ============================================================ */
function renderInquilinos(){
  const linhas = inquilinos.map(t => {
    const ct = contratoDoInquilino(t.id);
    const u = ct ? unidade(ct.unidadeId) : null;
    const atrasado = ct ? cobrancas.some(c => c.contratoId === ct.id && statusCobranca(c) === 'Atrasada') : false;
    return { t, ct, u, atrasado };
  });
  const ativos = linhas.filter(l => l.ct).length;

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Inquilinos</h1>
        <p>${ativos} com contrato ativo · ${inquilinos.length - ativos} sem locação</p>
      </div>
      <div class="actions"><button class="btn primary" data-action="new-tenant">Novo inquilino</button></div>
    </div>

    <section class="card">
      <table>
        <thead><tr><th>Inquilino</th><th>Contato</th><th>Unidade</th><th>Aluguel</th><th>Situação</th><th>Contrato até</th><th>Garantia</th></tr></thead>
        <tbody>
          ${linhas.map(({t,ct,u,atrasado}) => `<tr class="row-click" data-action="open-tenant" data-id="${t.id}">
            <td><span class="strong">${esc(t.nome)}</span><div class="small muted">${esc(t.cpf)}</div></td>
            <td><div>${esc(t.telefone)}</div><div class="small muted">${esc(t.email)}</div></td>
            <td>${u ? esc(u.nome) : '<span class="small muted">—</span>'}</td>

            <td class="num nowrap">${ct ? fmtAno(ct.fim) : '—'}</td>
            <td class="small nowrap">${esc(t.garantia)}</td>
          </tr>`).join('')}

    </section>
  `;
}

/* ============================================================
   Tela: Contratos
   ============================================================ */
function contratoChip(key, label){
  return `<button class="chip ${state.contratoFiltro === key ? 'active' : ''}" data-action="contrato-filtro" data-id="${key}">${label}</button>`;
}

function renderContratos(){
  const todos = contratos.slice();
  let lista = todos.slice();
  if(state.contratoFiltro === 'vigentes') lista = lista.filter(c => statusContrato(c) === 'Vigente');
  if(state.contratoFiltro === 'avencer') lista = lista.filter(c => statusContrato(c) === 'A vencer');
  if(state.contratoFiltro === 'encerrados') lista = lista.filter(c => statusContrato(c) === 'Encerrado');
  lista.sort((a,b) => {
    const pa = statusContrato(a) === 'Encerrado' ? 1 : 0;
    const pb = statusContrato(b) === 'Encerrado' ? 1 : 0;
    return pa - pb || a.fim - b.fim;
  });

  const ativos = todos.filter(c => statusContrato(c) !== 'Encerrado').length;
  const encerrados = todos.length - ativos;

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Contratos</h1>
        <p>${ativos} ativos · ${encerrados} encerrado${encerrados === 1 ? '' : 's'} · ${CONDOMINIO.nome}</p>
      </div>
      <div class="actions"><button class="btn primary" data-action="new-contract">Novo contrato</button></div>
    </div>

    <section class="card">
      <div class="filters">
        ${contratoChip('todos','Todos')}
        ${contratoChip('vigentes','Vigentes')}
        ${contratoChip('avencer','A vencer')}
        ${contratoChip('encerrados','Encerrados')}
        <span class="spacer"></span>
        <span class="small muted">${lista.length} ${plural(lista.length,'contrato','contratos')}</span>
      </div>
      <table>
        <thead><tr><th>Unidade</th><th>Inquilino</th><th>Vigência</th><th>Aluguel</th><th>Reajuste</th><th>Garantia</th><th>Status</th><th class="right">Ação</th></tr></thead>
        <tbody>
          ${lista.map(c => {
            const u = unidade(c.unidadeId);
            const t = inquilino(c.inquilinoId);
            const st = statusContrato(c);
            return `<tr class="row-click" data-action="open-unit-tab" data-id="${u.id}" data-tab="contrato">
              <td class="strong nowrap">${esc(u.nome)}</td>
              <td>${esc(t.nome)}</td>
              <td class="num nowrap">${fmtAno(c.inicio)} – ${fmtAno(c.fim)}</td>
              <td class="num nowrap">${money(c.aluguel)}</td>
              <td class="nowrap">${fmtAno(c.dataBase)}<div class="small muted">${esc(c.indice)}</div></td>
              <td class="small nowrap">${esc(c.garantia)}</td>
              <td>${badgeContrato(st)}</td>
              <td class="right">${st === 'A vencer' ? `<button class="btn sm" data-action="renew" data-id="${c.id}">Renovar</button>` : '<span class="small muted">—</span>'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </section>
  `;
}

/* ============================================================
   Tela: Cobranças
   ============================================================ */
function cobChip(key, label){
  return `<button class="chip ${state.cobFiltro === key ? 'active' : ''}" data-action="cob-filtro" data-id="${key}">${label}</button>`;
}

function renderCobrancas(){
  const ref = mesRef(state.mesOffset);
  const todas = cobrancasDoMes(ref);
  let lista = todas.slice();
  if(state.cobFiltro === 'abertas') lista = lista.filter(c => !c.pagoEm && c.vencimento >= HOJE);
  if(state.cobFiltro === 'atrasadas') lista = lista.filter(c => statusCobranca(c) === 'Atrasada');
  if(state.cobFiltro === 'pagas') lista = lista.filter(c => !!c.pagoEm);
  lista.sort((a,b) => a.vencimento - b.vencimento);

      ${stat('Em aberto', money(aberto), emAberto.length + ' a vencer', { money:true })}
      ${stat('Atrasado', money(atrasado), todas.filter(c => statusCobranca(c) === 'Atrasada').length + ' em atraso', { money:true, alert:atrasado > 0 })}

      ${monthToolbar()}

        ${cobChip('todas','Todas')}
        ${cobChip('abertas','Em aberto')}
        ${cobChip('atrasadas','Atrasadas')}
        ${cobChip('pagas','Pagas')}

        <span class="small muted">${lista.length} ${plural(lista.length,'cobrança','cobranças')}</span>
      </div>
      <table>
        <thead><tr><th>Inquilino</th><th>Unidade</th><th>Vencimento</th><th>Valor</th><th>Status</th><th class="right">Ação</th></tr></thead>
        <tbody>
          ${lista.length ? lista.map(c => {
            const ct = contrato(c.contratoId);
            const t = inquilino(ct.inquilinoId);
            const u = unidade(ct.unidadeId);
            const st = statusCobranca(c);
            return `<tr>
              <td>${esc(t.nome)}<div class="small muted">${c.pagoEm ? 'pago em ' + fmt(c.pagoEm) : st === 'Atrasada' ? 'em atraso há ' + diasAtraso(c) + ' dias' : 'em aberto'}</div></td>

    </section>
  `;
}

function manChip(key, label){
  return `<button class="chip ${state.manFiltro === key ? 'active' : ''}" data-action="man-filtro" data-id="${key}">${label}</button>`;
}

function renderManutencao(){
  let lista = manutencoes.slice();
  if(state.manFiltro === 'abertas') lista = lista.filter(m => m.status !== 'Concluída');
  if(state.manFiltro === 'andamento') lista = lista.filter(m => m.status === 'Em andamento');
  if(state.manFiltro === 'concluidas') lista = lista.filter(m => m.status === 'Concluída');
  lista.sort((a,b) => {
    const pa = a.status === 'Concluída' ? 1 : 0;
    const pb = b.status === 'Concluída' ? 1 : 0;
    return pa - pb || b.abertura - a.abertura;
  });

  const abertas = manutencoes.filter(m => m.status === 'Aberta');
  const andamento = manutencoes.filter(m => m.status === 'Em andamento');
  const concluidas = manutencoes.filter(m => m.status === 'Concluída');
  const custoAberto = manutencoes.filter(m => m.status !== 'Concluída').reduce((s,m) => s + m.custo, 0);

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Manutenção</h1>
        <p>Chamados das unidades · ${CONDOMINIO.nome}</p>

    </div>

    <div class="grid-stats">
      ${stat('Abertas', abertas.length, 'aguardando início')}
      ${stat('Em andamento', andamento.length, 'com fornecedor')}
      ${stat('Concluídas', concluidas.length, 'no histórico')}
      ${stat('Custo estimado', money(custoAberto), 'obras em aberto', { money:true })}
    </div>

    <section class="card">
      <div class="filters">
        ${manChip('abertas','Em aberto')}
        ${manChip('andamento','Em andamento')}
        ${manChip('concluidas','Concluídas')}
        ${manChip('todas','Todas')}
        <span class="spacer"></span>
        <span class="small muted">${lista.length} ${plural(lista.length,'chamado','chamados')}</span>
      </div>
      <table>
        <thead><tr><th>Unidade</th><th>Chamado</th><th>Prioridade</th><th>Fornecedor</th><th>Custo</th><th>Aberto há</th><th>Status</th><th class="right">Ação</th></tr></thead>
        <tbody>
          ${lista.length ? lista.map(m => `<tr>
            <td class="strong nowrap">${esc(unidade(m.unidadeId).nome)}</td>
            <td>${esc(m.titulo)}</td>
            <td>${badgePrioridade(m.prioridade)}</td>
            <td class="nowrap">${esc(m.fornecedor)}</td>

            <td class="num nowrap">${diffDays(HOJE, m.abertura)} dias</td>
            <td>${m.status === 'Concluída' ? '<span class="badge ok">Concluída</span>' : m.status === 'Em andamento' ? '<span class="badge info">Em andamento</span>' : '<span class="badge warn">Aberta</span>'}</td>
            <td class="right">${m.status === 'Concluída' ? '<span class="small muted">—</span>' : `<button class="btn sm" data-action="complete-maintenance" data-id="${m.id}">Concluir</button>`}</td>

/* ============================================================
   Tela: Financeiro
   ============================================================ */
function renderFinanceiro(){
  const ref = mesRef(state.mesOffset);
  const filtro = state.finUnidade;

  let receitas = cobrancasDoMes(ref).filter(c => c.pagoEm);
  let aReceber = cobrancasDoMes(ref).filter(c => !c.pagoEm);
  let listaDespesas = despesas.filter(x => noMes(x.data, ref));

  if(filtro){
    receitas = receitas.filter(c => contrato(c.contratoId).unidadeId === filtro);
    aReceber = aReceber.filter(c => contrato(c.contratoId).unidadeId === filtro);
    listaDespesas = listaDespesas.filter(x => x.unidadeId === filtro);
  }

  const totalRecebido = receitas.reduce((s,c) => s + c.valor, 0);
  const totalAReceber = aReceber.reduce((s,c) => s + c.valor, 0);
  const totalDespesas = listaDespesas.reduce((s,x) => s + x.valor, 0);
  const saldo = totalRecebido - totalDespesas;

  const lancamentos = [
    ...receitas.map(c => {
      const ct = contrato(c.contratoId);
      const u = unidade(ct.unidadeId);
      return { data:c.pagoEm, tipo:'Receita', categoria:'Aluguel', unidadeId:ct.unidadeId, descricao:'Aluguel — ' + u.nome, valor:c.valor };
    }),
    ...listaDespesas.map(x => ({ data:x.data, tipo:'Despesa', categoria:x.categoria, unidadeId:x.unidadeId, descricao:x.descricao, valor:x.valor }))
  ].sort((a,b) => b.data - a.data);

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Financeiro</h1>
        <p>Recebimentos e despesas · ${mesLabel(ref).toLowerCase()}</p>
      </div>
      <div class="actions"><button class="btn primary" data-action="new-expense">Nova despesa</button></div>
    </div>

    <div class="grid-stats">
      ${stat('Recebido', money(totalRecebido), receitas.length + ' recebimentos', { money:true })}
      ${stat('A receber', money(totalAReceber), aReceber.length + ' em aberto', { money:true })}
      ${stat('Despesas', money(totalDespesas), listaDespesas.length + ' lançamentos', { money:true })}
      ${stat('Saldo do mês', money(saldo), saldo >= 0 ? 'resultado positivo' : 'resultado negativo', { money:true, alert:saldo < 0 })}
    </div>

    <section class="card">
      ${monthToolbar()}
      <div class="filters">
        <select data-filter="finUnidade" aria-label="Filtrar por unidade">
          <option value="">Unidade: todas</option>
          ${unidades.map(u => `<option value="${u.id}" ${filtro === u.id ? 'selected' : ''}>${esc(u.nome)}</option>`).join('')}
        </select>
        <span class="spacer"></span>
        <span class="small muted">${lancamentos.length} lançamentos</span>
      </div>
      <table>
        <thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Unidade</th><th>Descrição</th><th class="right">Valor</th></tr></thead>
        <tbody>
          ${lancamentos.length ? lancamentos.map(l => `<tr>
            <td class="num nowrap">${fmt(l.data)}</td>
            <td><span class="badge ${l.tipo === 'Receita' ? 'ok' : 'neutral'}">${l.tipo}</span></td>
            <td class="nowrap">${esc(l.categoria)}</td>
            <td class="nowrap">${l.unidadeId ? esc(unidade(l.unidadeId).nome) : '<span class="small muted">Terreno / geral</span>'}</td>
            <td>${esc(l.descricao)}</td>
            <td class="right num ${l.tipo === 'Despesa' ? 'text-danger' : ''}">${l.tipo === 'Despesa' ? '− ' : ''}${money(l.valor)}</td>
          </tr>`).join('') : '<tr><td colspan="6"><div class="empty">Nenhum lançamento neste mês.</div></td></tr>'}
        </tbody>
      </table>
    </section>
  `;
}
/* ============================================================
   Navegação
   ============================================================ */
function render(){
  const ativo = state.view === 'unidade' ? 'imoveis' : state.view;
  document.querySelectorAll('.nav-item[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === ativo);
  });

  if(state.view === 'hoje') renderHoje();
  else if(state.view === 'imoveis') renderImoveis();
  else if(state.view === 'unidade') renderUnidade();
  else if(state.view === 'inquilinos') renderInquilinos();
  else if(state.view === 'contratos') renderContratos();
  else if(state.view === 'cobrancas') renderCobrancas();
  else if(state.view === 'manutencao') renderManutencao();
  else if(state.view === 'financeiro') renderFinanceiro();

  syncHash();
}

function syncHash(){
  const hash = state.view === 'unidade' && state.selectedUnit
    ? '#unidade/' + state.selectedUnit
    : '#' + state.view;
  if(location.hash === hash) return;
  try { history.replaceState(null, '', hash); } catch(e) { /* file:// */ }
}

function setView(view){
  state.view = view;
  if(view !== 'unidade') state.selectedUnit = null;
  render();
  window.scrollTo(0, 0);
}

function openUnit(id){
  state.selectedUnit = id;
  state.unitTab = 'contrato';
  state.view = 'unidade';
  render();
  window.scrollTo(0, 0);
}

function openUnitTab(id, tab){
  state.selectedUnit = id;
  state.unitTab = tab || 'contrato';
  state.view = 'unidade';
  render();
  window.scrollTo(0, 0);
}

function openTenant(tid){
  const ct = contratoDoInquilino(tid);
  if(!ct){ toast('Este inquilino está sem contrato ativo'); return; }
  openUnit(ct.unidadeId);
}

/* ============================================================
   Modais
   ============================================================ */
const modalRoot = document.getElementById('modal-root');
const toastRoot = document.getElementById('toast-root');
const parseDate = s => new Date(s + 'T00:00:00');

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  toastRoot.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function closeModal(){ modalRoot.innerHTML = ''; }

function openModal(opts){
  modalRoot.innerHTML = `<div class="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(opts.title)}">
      <div class="modal-head">
        <strong>${esc(opts.title)}</strong>
        <button class="btn ghost sm" type="button" data-action="close-modal">Fechar</button>
      </div>
      <form id="modal-form">
        <div class="modal-body">${opts.body}</div>
        <div class="modal-foot">
          <button class="btn" type="button" data-action="close-modal">Cancelar</button>
          <button class="btn primary" type="submit">${esc(opts.submitLabel || 'Salvar')}</button>
        </div>
      </form>
    </div>
  </div>`;

  const overlay = modalRoot.querySelector('.overlay');
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });

  const form = document.getElementById('modal-form');
  form.addEventListener('submit', e => {
    e.preventDefault();
    opts.onSubmit(Object.fromEntries(new FormData(form).entries()));
  });

  const primeiro = form.querySelector('input, select, textarea');
  if(primeiro) primeiro.focus();
}

  openModal({
    title:'Novo contrato',
    submitLabel:'Criar contrato',
    body:`

          <label for="ct-vencimento">Dia do vencimento</label>

        indice:dados.indice,
        dataBase:addMonths(parseDate(dados.inicio), 12),
        garantia:dados.garantia,
        vencimentoDia:Number(dados.vencimentoDia) || 10,
        status:'Vigente',
        reajustes:[]
      };
      contratos.push(ct);
      u.status = 'Alugado';
      u.aluguel = ct.aluguel;
      u.vencimentoDia = ct.vencimentoDia;
      u.inquilinoId = ct.inquilinoId;
      delete u.vagoDesde;

      const venc = diaNoMes(1, ct.vencimentoDia);
      cobrancas.push({
        id:'cb' + Date.now(),
        contratoId:ct.id,
        competencia:mesRef(1),
        vencimento:venc,
        valor:ct.aluguel,
        pagoEm:null,
        valorPago:0,
        forma:null,
        recibo:null
      });

      closeModal();
      state.selectedUnit = u.id;
      state.unitTab = 'contrato';
      state.view = 'unidade';
      render();
      toast('Contrato criado · primeira cobrança em ' + mesLabel(mesRef(1)));
    }
  });
}

/* ---------- novo inquilino ---------- */

  openModal({
    title:'Novo inquilino',
    submitLabel:'Cadastrar',
    body:`
      <div class="field">
        <label for="iq-nome">Nome</label>
        <input id="iq-nome" name="nome" placeholder="Nome completo" required>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="iq-cpf">CPF</label>
          <input id="iq-cpf" name="cpf" placeholder="000.000.000-00">
        </div>
        <div class="field">
          <label for="iq-telefone">Telefone</label>
          <input id="iq-telefone" name="telefone" placeholder="(11) 90000-0000">
        </div>
      </div>
      <div class="field">
        <label for="iq-email">E-mail</label>
        <input id="iq-email" type="email" name="email" placeholder="nome@email.com">
      </div>
      <div class="field">
        <label for="iq-garantia">Garantia</label>
        <select id="iq-garantia" name="garantia">
          <option>Fiador</option>
          <option>Caução (3 aluguéis)</option>
          <option>Seguro-fiança</option>
        </select>

    `,

        cpf:dados.cpf || '—',
        telefone:dados.telefone || '—',
        email:dados.email || '—',

      });

      render();
      toast('Inquilino cadastrado');
    }
  });
}

/* ---------- nova unidade ---------- */
function openNovaUnidade(){
  openModal({
    title:'Nova unidade',
    submitLabel:'Cadastrar unidade',
    body:`
      <div class="field">
        <label for="un-nome">Nome</label>
        <input id="un-nome" name="nome" placeholder="Ex.: Casa 7" required>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="un-tipo">Tipo</label>
          <select id="un-tipo" name="tipo">
            <option>Casa</option>
            <option>Kitnet</option>
            <option>Studio</option>
            <option>Apartamento</option>
          </select>
        </div>
        <div class="field">
          <label for="un-quartos">Quartos</label>
          <input id="un-quartos" type="number" min="1" max="10" name="quartos" value="1" required>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="un-area">Área (m²)</label>
          <input id="un-area" type="number" min="1" name="area" value="40" required>
        </div>
        <div class="field">
          <label for="un-aluguel">Aluguel pretendido (R$)</label>
          <input id="un-aluguel" type="number" step="0.01" min="0" name="aluguel" required>
        </div>
      </div>
      <p class="note">A unidade entra como vaga, no mesmo endereço da vila.</p>
    `,
    onSubmit(dados){
      unidades.push({
        id:'u' + Date.now(),
        nome:dados.nome,
        tipo:dados.tipo,
        quartos:Number(dados.quartos) || 1,
        area:Number(dados.area) || 0,
        status:'Vago',
        aluguelPretendido:Number(dados.aluguel) || 0,
        vagoDesde:HOJE,
        inquilinoId:null,
        docs:[]
      });
      closeModal();
      render();
      toast('Unidade cadastrada');
    }
  });
}

/* ---------- renovar contrato ---------- */
function openRenovar(id){
  const ct = contrato(id);
  if(!ct) return;
  const t = inquilino(ct.inquilinoId);
  const u = unidade(ct.unidadeId);
  const sugerido = ct.aluguel * 1.042;
  const novoFim = addDays(addMonths(ct.fim, 12), -1);

  openModal({
    title:'Renovar contrato',
    submitLabel:'Renovar',
    body:`
      <p class="note">${esc(t.nome)} · ${esc(u.nome)} · vigência atual até ${fmt(ct.fim)}</p>
      <div class="form-row">
        <div class="field">
          <label for="rn-aluguel">Novo aluguel (R$)</label>
          <input id="rn-aluguel" type="number" step="0.01" min="0" name="aluguel" value="${sugerido.toFixed(2)}" required>
        </div>
        <div class="field">
          <label for="rn-fim">Nova data fim</label>
          <input id="rn-fim" type="date" name="fim" value="${iso(novoFim)}" required>
        </div>
      </div>
      <p class="note">Reajuste estimado pelo ${esc(ct.indice)}: 4,2%. O valor pode ser ajustado.</p>
    `,
    onSubmit(dados){
      const novo = Number(dados.aluguel) || ct.aluguel;
      ct.reajustes.push({ data:HOJE, de:ct.aluguel, para:novo });
      ct.aluguel = novo;
      ct.fim = parseDate(dados.fim);
      ct.dataBase = addMonths(ct.dataBase, 12);
      ct.status = 'Vigente';
      u.aluguel = novo;
      closeModal();
      render();
      toast('Contrato renovado · novo aluguel ' + money(novo));
    }
  });
}

/* ---------- encerrar contrato ---------- */
function openEncerrar(id){
  const ct = contrato(id);
  if(!ct) return;
  const t = inquilino(ct.inquilinoId);
  const u = unidade(ct.unidadeId);

  openModal({
    title:'Encerrar contrato',
    submitLabel:'Encerrar',
    body:`
      <p class="note">${esc(t.nome)} · ${esc(u.nome)}</p>
      <div class="field">
        <label for="en-data">Data de saída</label>
        <input id="en-data" type="date" name="data" value="${iso(HOJE)}" required>
      </div>
      <p class="note">A unidade ficará marcada como vaga nesta data e entrará no cálculo de vacância.</p>
    `,
    onSubmit(dados){
      const saida = parseDate(dados.data);
      ct.status = 'Encerrado';
      if(saida < ct.fim) ct.fim = saida;
      u.status = 'Vago';
      u.vagoDesde = saida;
      u.aluguelPretendido = ct.aluguel;
      u.inquilinoId = null;
      closeModal();
      render();
      toast('Contrato encerrado · unidade vaga');
    }
  });
}

/* ============================================================
   Eventos
   ============================================================ */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-view]');
  if(nav){ setView(nav.dataset.view); return; }

  const el = e.target.closest('[data-action]');
  if(!el) return;

  const acao = el.dataset.action;
  const id = el.dataset.id || null;

  if(acao === 'nav'){ setView(id); return; }
  if(acao === 'close-modal'){ closeModal(); return; }
  if(acao === 'toast'){ toast(el.dataset.msg || 'Ação simulada neste protótipo'); return; }
  if(acao === 'open-unit'){ openUnit(id); return; }
  if(acao === 'open-unit-tab'){ openUnitTab(id, el.dataset.tab); return; }
  if(acao === 'open-tenant'){ openTenant(id); return; }

  if(acao === 'pay'){ openPagamento(id); return; }
  if(acao === 'new-expense'){ openDespesa(id); return; }
  if(acao === 'new-maintenance'){ openManutencao(id); return; }
  if(acao === 'new-contract'){ openNovoContrato(id); return; }
  if(acao === 'new-tenant'){ openNovoInquilino(); return; }
  if(acao === 'new-unit'){ openNovaUnidade(); return; }
  if(acao === 'renew'){ openRenovar(id); return; }
  if(acao === 'end-contract'){ openEncerrar(id); return; }

  if(acao === 'complete-maintenance'){
    const m = manutencoes.find(x => x.id === id);
    if(m && m.status !== 'Concluída'){
      m.status = 'Concluída';
      m.conclusao = HOJE;
      despesas.push({
        id:'ds' + Date.now(),
        unidadeId:m.unidadeId,
        categoria:'Manutenção',
        descricao:m.titulo + ' — ' + unidade(m.unidadeId).nome,
        valor:m.custo,
        data:HOJE,
        recorrente:false
      });
      render();
      toast('Manutenção concluída · despesa lançada');
    }
    return;
  }

  if(acao === 'unit-tab'){ state.unitTab = id; render(); return; }
  if(acao === 'cob-filtro'){ state.cobFiltro = id; render(); return; }
  if(acao === 'man-filtro'){ state.manFiltro = id; render(); return; }
  if(acao === 'contrato-filtro'){ state.contratoFiltro = id; render(); return; }

  if(acao === 'mes'){ state.mesOffset += Number(id); render(); return; }
  if(acao === 'mes-hoje'){ state.mesOffset = 0; render(); return; }

  if(acao === 'clear-filters'){
    state.filtroStatus = '';
    state.search = '';
    searchInput.value = '';
    render();
    return;
  }
});

content.addEventListener('change', e => {
  const el = e.target.closest('[data-filter]');
  if(!el) return;
  state[el.dataset.filter] = el.value;
  render();
});

searchInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    state.search = searchInput.value.trim();
    setView('imoveis');
  }
});

searchInput.addEventListener('input', () => {
  if(searchInput.value.trim() === '' && state.search !== ''){
    state.search = '';
    if(state.view === 'imoveis') render();
  }
});

document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
  if(e.key === 'Escape') closeModal();
});

/* ============================================================
   Início
   ============================================================ */
function aplicarHash(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if(h.indexOf('unidade/') === 0){
    const id = h.slice('unidade/'.length);
    if(unidades.some(u => u.id === id)){
      state.selectedUnit = id;
      state.unitTab = 'contrato';
      state.view = 'unidade';
      return;
    }
  }
  if(['hoje','imoveis','inquilinos','contratos','cobrancas','manutencao','financeiro'].indexOf(h) !== -1){
    state.view = h;
    state.selectedUnit = null;
  }
}

window.addEventListener('hashchange', () => { aplicarHash(); render(); });

aplicarHash();
render();

</script>
